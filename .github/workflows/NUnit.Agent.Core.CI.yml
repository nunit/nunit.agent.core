name: NUnit.Agent.Core.CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  checks: write

env:
  DOTNET_NOLOGO: true                     # Disable the .NET logo
  DOTNET_CLI_TELEMETRY_OPTOUT: true       # Disable sending .NET CLI telemetry

jobs:
  ContinuousIntegration:
    name: Continuous Integration Windows Build
    runs-on: windows-latest

    env:
        MYGET_API_KEY: ${{ secrets.PUBLISH_MYGET_ORG }}
        NUGET_API_KEY: ${{ secrets.PUBLISH_NUGET_ORG }}
        CHOCO_API_KEY: ${{ secrets.PUBLISH_CHOCOLATEY_ORG }}
        GITHUB_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_CP }}

    steps:
    - name: ⤵️ Checkout Source
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: 🛠️ Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
            5.0.x
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x
        
    - name: 🛠️ Install dotnet tools
      run: dotnet tool restore

    - name: 🔨 Build, Test, Package and Publish (Cake script decides)
      run: dotnet cake --target=ContinuousIntegration --configuration=Release #--verbosity=diagnostic

    # Upload packages
    - name: 💾 Upload Packages
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Packages
        path: packages

